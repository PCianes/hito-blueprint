# Runs only in hito-blueprint, where the base is developed: in your copy it never runs, and you
# can delete the .github/ folder.
# On every push: the full check, with every test of the base, and the rehearsal (dev/rehearse.sh),
# on Linux and macOS. Launched by hand (gh workflow run check.yml), also on Windows, where it
# takes about 40 minutes: it is run before tagging a version. On a version tag, it also proves
# the tag matches blueprint/VERSION.
name: check
on:
  push:
  workflow_dispatch:
jobs:
  check:
    if: github.repository == 'PCianes/hito-blueprint'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # on Windows, Git Bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install git-crypt
        if: runner.os != 'Windows'
        run: if command -v brew > /dev/null; then brew install git-crypt; else sudo apt-get install -y git-crypt; fi
      - name: Install git-crypt on Windows (the official build, the last one published for it)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/git-crypt.exe" https://github.com/AGWA/git-crypt/releases/download/0.7.0/git-crypt-0.7.0-x86_64.exe
          # the file as published on 2026-11-25: stop if it ever changes
          echo "8c54a3b583cd4fc1483c952480116a9c86f771b02d4403fc6d3627b26cf146e2  $HOME/bin/git-crypt.exe" | sha256sum -c -
          cygpath -w "$HOME/bin" >> "$GITHUB_PATH"  # the runner reads Windows paths
          "$HOME/bin/git-crypt.exe" --version
      - name: Set up as where the base is developed
        run: |
          git config core.hooksPath blueprint/git-hooks
          git config hito.develop true
      - name: Check, with every test
        run: sh blueprint/scripts/check.sh
      - name: Rehearse
        run: sh dev/rehearse.sh
      - name: The tag matches blueprint/VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$(cat blueprint/VERSION)" = "${GITHUB_REF_NAME}"
